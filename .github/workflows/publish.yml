name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: CI build number to publish (empty for latest successful on the selected branch)
        required: false
        type: string
      preview:
        description: Publish as a preview package
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select successful CI build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if ($env:BUILD_NUMBER -and $env:BUILD_NUMBER -cnotmatch '^[1-9][0-9]*$') {
            throw "Build number must be a positive integer."
          }
          $selected = $null
          for ($page = 1; ; $page++) {
            $json = gh api --method GET "repos/$env:GH_REPO/actions/workflows/ci.yml/runs" -f "branch=$env:REF_NAME" -f status=success -f per_page=100 -f "page=$page"
            if ($LASTEXITCODE -ne 0) { throw "Could not query successful CI builds." }
            $runs = @((($json -join "`n") | ConvertFrom-Json).workflow_runs)
            if ($runs.Count -eq 0) { break }
            $selected = $runs | Where-Object {
              $_.event -in @('push', 'workflow_dispatch') -and
              (!$env:BUILD_NUMBER -or [string]$_.run_number -eq $env:BUILD_NUMBER)
            } | Select-Object -First 1
            if ($selected) { break }
          }
          if (!$selected) {
            throw "No successful CI build matching '$env:BUILD_NUMBER' was found on '$env:REF_NAME'. Pull request builds cannot be published."
          }
          $version = "3.0.$($selected.run_number)"
          if ($env:PREVIEW -eq 'true') { $version += '-preview' }
          "run-id=$($selected.id)" >> $env:GITHUB_OUTPUT
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "SOURCE_COMMIT=$($selected.head_sha)" >> $env:GITHUB_ENV
          "Publishing CI build $($selected.run_number), commit $($selected.head_sha), as $version."
          "## NuGet publication`nCI build: $($selected.run_number)`n`nCommit: $($selected.head_sha)`n`nVersion: $version" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts\packages
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Check publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "Set the NUGET_USER Actions variable to your nuget.org username."
          }
          if (!(Test-Path -LiteralPath "artifacts\packages\ObjectListView.WinForms.$env:PACKAGE_VERSION.nupkg")) {
            throw "The selected CI artifact does not contain package version $env:PACKAGE_VERSION."
          }

      - name: Tag release source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          $json = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check release tag $tag." }
          $existing = ($json -join "`n") | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" }
          if ($existing) {
            $target = $existing.object
            while ($target.type -eq 'tag') {
              $json = gh api "repos/$env:GH_REPO/git/tags/$($target.sha)"
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag $tag." }
              $target = (($json -join "`n") | ConvertFrom-Json).object
            }
            if ($target.type -ne 'commit' -or $target.sha -ne $env:SOURCE_COMMIT) {
              throw "Release tag $tag already points to a different object. It will not be moved."
            }
            "Release tag $tag already points to $env:SOURCE_COMMIT."
          } else {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SOURCE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
          }

      - name: Prepare GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          $packageName = "ObjectListView.WinForms.$env:PACKAGE_VERSION.nupkg"
          $packagePath = "artifacts\packages\$packageName"
          $isPreview = $env:PACKAGE_VERSION.EndsWith('-preview')
          $json = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing GitHub releases." }
          $existing = ($json -join "`n") | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $tag }
          if ($existing) {
            if ($existing.prerelease -ne $isPreview) {
              throw "Release $tag has a different prerelease setting. It will not be changed."
            }
            if (!($existing.assets | Where-Object { $_.name -eq $packageName })) {
              gh release upload $tag $packagePath
              if ($LASTEXITCODE -ne 0) { throw "Could not attach package to release $tag." }
            }
            "publish=$($existing.draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "Release $tag is prepared; existing release notes were preserved."
          } else {
            $arguments = @('release', 'create', $tag, $packagePath, '--draft', '--verify-tag', '--generate-notes', '--title', $tag)
            if ($isPreview) { $arguments += @('--prerelease', '--latest=false') }
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft GitHub release $tag." }
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Authenticate to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts\packages\ObjectListView.WinForms.$env:PACKAGE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate

      - name: Publish GitHub Release
        if: ${{ success() && steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish draft release $tag." }
